openapi: 3.0.3
info:
  title: 神社_APP API (MVP)
  version: 0.1.0
  description: >
    神社_APP の最小MVP向けAPI定義。人気神社、最寄神社、コンシェルジュ履歴、経路取得を提供します。
  contact:
    name: Jinja_APP Team
    email: dev@example.com
servers:
  - url: http://127.0.0.1:8000

tags:
  - name: Shrines
    description: 神社の検索・ランキングなど
  - name: Concierge
    description: コンシェルジュ機能の履歴参照
  - name: Routes
    description: 経路検索（距離・時間・ポリライン）
  - name: ScoreV3Admin
    description: Score v3 観測・判定ダッシュボード（IsAdminUser 専用）
  - name: DeepDive
    description: Deep Dive 回答生成（Verified Knowledge Factのみを根拠にしたLLM回答）

paths:
  /api/populars/:
    get:
      summary: 人気神社の最小一覧（30日スコア順）
      description: 直近期間の人気スコアで並べた神社一覧を返します。最小形のレスポンスのみを返却します。
      tags: [Shrines]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularsResponse"

  /api/shrines/nearest/:
    get:
      summary: 現在地から近い神社（最小情報）
      description: 指定された緯度経度から近い神社を距離順で返します。distance_m は必須、所要時間は任意です。
      tags: [Shrines]
      parameters:
        - in: query
          name: lat
          schema: { type: number }
          required: true
        - in: query
          name: lng
          schema: { type: number }
          required: true
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearestResponse"

  /api/concierges/histories/:
    get:
      summary: コンシェルジュ履歴一覧
      description: これまでの相談履歴（スレッド）を、最終メッセージ時刻の降順で返します。
      tags: [Concierge]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedConciergeHistoryList"

  /api/concierges/histories/{id}/:
    get:
      summary: コンシェルジュ履歴の詳細（会話ログ）
      description: 1件の履歴（スレッド）と、その中のメッセージ一覧を返します。
      tags: [Concierge]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeHistoryDetail"


  /api/concierge/chat/:
    post:
      tags: [Concierge]
      summary: Concierge chat recommendations
      description: >
        コンシェルジュ推薦を返す。契約フィールドは data._need / recommendations[].breakdown / data._signals.mode を保証する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeChatRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeChatResponse"

  /api/concierge/plan/:
    post:
      tags: [Concierge]
      summary: Concierge plan (route / shrine suggestions)
      description: >
        クエリをもとに参拝プランを生成する。おすすめ候補、中心候補、ルート情報を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergePlanRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergePlanResponse"
        "400":
          description: Validation Error
        "401":
          description: Unauthorized

  /api/shrine-submissions/:
    post:
      summary: 神社投稿submissionを作成
      description: ログインユーザーが神社登録候補を pending 状態で投稿する
      tags: [Shrines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShrineSubmissionCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShrineSubmissionResponse"
        "400":
          description: Validation Error
        "401":
          description: Unauthorized


  /api/concierge/score-v3/dashboard/:
    get:
      tags: [ScoreV3Admin]
      summary: Score v3 観測結果と funnel の突合ダッシュボード
      description: >
        score_v3 の shadow/active 観測集計値と behavior funnel を突合し、
        active_candidate / rollback_required の判定結果を返す。
        IsAdminUser 専用。未認証は 401、非 staff は 403 を返す。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreV3DashboardResponse"
              example:
                score_v3:
                  top1_changed_rate_avg: 0.05
                  activation_candidate_rate: 0.92
                  avg_delta: -0.08
                  max_abs_delta_max: 0.31
                funnel:
                  route_open_rate: 0.34
                  save_rate: 0.22
                  visit_done_rate: 0.11
                  reflection_saved_rate: 0.06
                decision:
                  active_candidate: true
                  rollback_required: false
                  reasons: []
        "401":
          description: Unauthorized — 未認証リクエスト
        "403":
          description: Forbidden — staff 権限がないユーザー

  /api/directions/:
    get:
      summary: 単一経路の最小結果（エンコードポリライン付き）
      description: origin/dest を lat,lng 文字列で受け取り、距離・時間・ポリラインのみ返します。
      tags: [Routes]
      parameters:
        - in: query
          name: origin
          description: "lat,lng（例: 35.681236,139.767125）"
          schema: { type: string, pattern: "^-?\\d+\\.?\\d*,-?\\d+\\.?\\d*$" }
          required: true
        - in: query
          name: dest
          description: "lat,lng（例: 35.658034,139.701636）"
          schema: { type: string, pattern: "^-?\\d+\\.?\\d*,-?\\d+\\.?\\d*$" }
          required: true
        - in: query
          name: mode
          schema:
            type: string
            enum: [walking, driving]
          required: false
          description: 省略時は walking
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectionsResponse"

  /api/deep-dive/ask/:
    post:
      summary: Deep Dive 回答生成
      description: >
        shrine_id + question を受け取り、Verified Knowledge Factのみを根拠にした
        回答を返す。readiness判定・Fact取得・Evidence filtering・LLM呼び出しは
        すべてBackendが行う（Client側はreadiness/facts/sources/confidence/
        verification_statusのいずれも指定できない）。readiness="not_ready"や
        該当Factが0件の場合もHTTP 200で返る（Knowledge不足という正常な
        Product Stateであり、エラーではない）。
      tags: [DeepDive]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeepDiveAskRequest"
      responses:
        "200":
          description: OK（readiness="not_ready"／Fact 0件の場合も200で返る）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepDiveAskResponse"
        "400":
          description: Validation Error — shrine_id/questionが不正
        "404":
          description: Not Found — 指定されたshrine_idの神社が存在しない
        "500":
          description: Internal Server Error — 予期しない内部エラー


components:
  schemas:
    ShrineSubmissionCreateRequest:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        address: { type: string }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        goriyaku_tags:
          type: array
          items: { type: string }
        note: { type: string }

    ShrineSubmissionResponse:
      type: object
      required: [id, name, address, goriyaku_tags, note, status, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        goriyaku_tags:
          type: array
          items: { type: string }
        note: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
          format: date-time

    ShrineLite:
      type: object
      required: [id, name, lat, lng]
      properties:
        id: { type: integer, example: 123 }
        name: { type: string, example: "明治神宮" }
        lat: { type: number, format: double, example: 35.6764 }
        lng: { type: number, format: double, example: 139.6993 }
        address:
          type: string
          nullable: true
          example: "東京都渋谷区代々木神園町1-1"

    PopularItem:
      type: object
      required: [shrine, score]
      properties:
        shrine: { $ref: "#/components/schemas/ShrineLite" }
        score: { type: number, example: 87.3 }
        period_days: { type: integer, example: 30 }

    PopularsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PopularItem" }

    NearestItem:
      type: object
      required: [shrine, distance_m]
      properties:
        shrine: { $ref: "#/components/schemas/ShrineLite" }
        distance_m: { type: integer, example: 420 }
        walking_minutes:
          type: number
          nullable: true
          example: 6
        driving_minutes:
          type: number
          nullable: true
          example: 2

    NearestResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NearestItem" }



    DirectionsResponse:
      type: object
      required: [mode, distance_m, duration_min, polyline]
      properties:
        mode:
          type: string
          enum: [walking, driving]
          example: walking
        distance_m:
          type: integer
          example: 1850
        duration_min:
          type: number
          example: 24.5
        polyline:
          type: string
          description: "Google/Mapbox 互換のエンコードポリライン"
          example: "}a~vF|y`uO??_seK`@"

    ConciergeMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: integer
          example: 123
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        created_at:
          type: string
          format: date-time

    ConciergeHistory:  # = Thread 1件分（一覧用）
      type: object
      required: [id, created_at, updated_at, last_message_at, message_count]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          nullable: true
        last_message:
          type: string
          description: "最後のメッセージ本文（先頭数百文字程度）"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
        message_count:
          type: integer
          example: 5

    PaginatedConciergeHistoryList:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConciergeHistory"

    ConciergeHistoryDetail:
      type: object
      required: [id, created_at, updated_at, last_message_at, message_count, messages]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
        message_count:
          type: integer
          example: 5
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConciergeMessage"
    
        # ----------------------------
    # Concierge Chat (contract)
    # ----------------------------

    ConciergeChatRequest:
      type: object
      required: [message, candidates]
      properties:
        message:
          type: string
          description: "ユーザー入力（message/query のどちらかは必須運用だが、契約は message を基準にする）"
        query:
          type: string
          nullable: true
          description: "互換用: message の別名"
        birthdate:
          type: string
          nullable: true
          example: "1984-05-15"
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        goriyaku_tag_ids:
          type: array
          nullable: true
          items: { type: integer }
        extra_condition:
          type: string
          nullable: true
        flow:
          type: string
          nullable: true
          enum: ["A", "B"]
        candidates:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              formatted_address: { type: string, nullable: true }
              address: { type: string, nullable: true }
              lat: { type: number, nullable: true }
              lng: { type: number, nullable: true }
              distance_m: { type: number, nullable: true }
              place_id: { type: string, nullable: true }
              shrine_id: { type: integer, nullable: true }
              goriyaku_tag_ids:
                type: array
                nullable: true
                items: { type: integer }
              popular_score: { type: number, nullable: true }

    ConciergeNeed:
      type: object
      required: [tags, hits]
      additionalProperties: false
      properties:
        tags:
          type: array
          maxItems: 3
          items: { type: string }
        hits:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    ConciergeBreakdownWeights:
      type: object
      required: [element, need, popular]
      additionalProperties: false
      properties:
        element: { type: number }
        need: { type: number }
        popular: { type: number }

    ConciergeBreakdown:
      type: object
      required:
        - score_element
        - score_need
        - score_popular
        - score_total
        - weights
        - matched_need_tags
      additionalProperties: true
      properties:
        score_element: { type: integer }
        score_need: { type: integer }
        score_popular:
          type: number
          minimum: 0
          maximum: 1
        score_total: { type: number }
        weights:
          $ref: "#/components/schemas/ConciergeBreakdownWeights"
        matched_need_tags:
          type: array
          items: { type: string }

    ConciergeSignalsMode:
      type: object
      required: [flow, weights, astro_bonus_enabled]
      additionalProperties: true
      properties:
        flow: { type: string, enum: ["A", "B"] }
        weights:
          $ref: "#/components/schemas/ConciergeBreakdownWeights"
        astro_bonus_enabled: { type: boolean }
        description: { type: string, nullable: true }
        ui_label_ja: { type: string, nullable: true }
        ui_note_ja: { type: string, nullable: true }

    ConciergeSignals:
      type: object
      required: [mode]
      additionalProperties: true
      properties:
        mode:
          $ref: "#/components/schemas/ConciergeSignalsMode"
        # 他は運用で増えるので optional のまま
        result_state:
          type: object
          nullable: true
        llm:
          type: object
          nullable: true

    ConciergeRecommendation:
      type: object
      required: [name, reason, breakdown]
      additionalProperties: true
      properties:
        name: { type: string }
        reason: { type: string }
        breakdown:
          $ref: "#/components/schemas/ConciergeBreakdown"

        # --- 以下は運用で付く/付かないので optional ---
        location: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        distance_m: { type: number, nullable: true }
        place_id: { type: string, nullable: true }
        shrine_id: { type: integer, nullable: true }
        popular_score: { type: number, nullable: true }
        astro_priority: { type: integer, nullable: true }
        astro_elements:
          type: array
          nullable: true
          items: { type: string }
        astro_tags:
          type: array
          nullable: true
          items: { type: string }

    ConciergeChatData:
      type: object
      required: [_need, recommendations, _signals]
      additionalProperties: true
      properties:
        _need:
          $ref: "#/components/schemas/ConciergeNeed"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/ConciergeRecommendation"
        _signals:
          $ref: "#/components/schemas/ConciergeSignals"

    ConciergeChatResponse:
      type: object
      required: [ok, data]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/ConciergeChatData"

    ConciergePlanRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: "参拝プランの元となる検索クエリ"
        language:
          type: string
          nullable: true
          default: ja
          description: "応答言語。既定は ja"
        transportation:
          type: string
          enum: [walk, driving]
          default: walk
          description: "移動手段"
        area:
          type: string
          nullable: true
          description: "地名ベースの検索補助入力"
        lat:
          type: number
          nullable: true
          description: "現在地または検索基準点の緯度"
        lng:
          type: number
          nullable: true
          description: "現在地または検索基準点の経度"
        radius_m:
          type: number
          nullable: true
          description: "検索半径（メートル）"
        radius_km:
          oneOf:
            - type: number
            - type: string
          nullable: true
          description: "検索半径（キロメートル）。互換入力を許可する"
        locationbias:
          type: string
          nullable: true
          description: "location bias 用の補助パラメータ"


    ConciergePlanLocation:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number

    ConciergePlanMain:
      type: object
      additionalProperties: true
      properties:
        location:
          $ref: "#/components/schemas/ConciergePlanLocation"

    ConciergePlanRouteHints:
      type: object
      additionalProperties: true
      properties:
        mode:
          type: string
          enum: [walk, driving]

    ConciergePlanRecommendation:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        bullets:
          type: array
          nullable: true
          items:
            type: string
        highlights:
          type: array
          nullable: true
          items:
            type: string
        display_address:
          type: string
          nullable: true
        location:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ConciergePlanLocation"
            - type: string

    ConciergePlanStop:
      type: object
      required: [order, name, display_address, location, eta_minutes, travel_minutes, stay_minutes]
      additionalProperties: true
      properties:
        order:
          type: integer
        name:
          type: string
        display_address:
          type: string
        location:
          $ref: "#/components/schemas/ConciergePlanLocation"
        eta_minutes:
          type: number
        travel_minutes:
          type: number
        stay_minutes:
          type: number

    ConciergePlanData:
      type: object
      required: [recommendations]
      additionalProperties: true
      properties:
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/ConciergePlanRecommendation"
        _explanations:
          nullable: true

    ScoreV3Metrics:
      type: object
      required:
        - top1_changed_rate_avg
        - activation_candidate_rate
        - avg_delta
        - max_abs_delta_max
      properties:
        top1_changed_rate_avg:
          type: number
          format: float
          description: "観測期間中の top1 変動率の平均。0.10 以下が active 化目安。"
          example: 0.05
        activation_candidate_rate:
          type: number
          format: float
          description: "activation_candidate=true だったセッション比率。0.80 以上が active 化目安。"
          example: 0.92
        avg_delta:
          type: number
          format: float
          description: "score_v3 と score_total の平均差分（score_v3 − score_total）。"
          example: -0.08
        max_abs_delta_max:
          type: number
          format: float
          description: "各セッションの max_abs_delta の最大値。0.50 未満が active 化目安。"
          example: 0.31

    ScoreV3FunnelMetrics:
      type: object
      required:
        - route_open_rate
        - save_rate
        - visit_done_rate
        - reflection_saved_rate
      properties:
        route_open_rate:
          type: number
          format: float
          description: "推薦候補に対して route_open アクションが発生した比率。"
          example: 0.34
        save_rate:
          type: number
          format: float
          description: "推薦候補に対して save アクションが発生した比率。"
          example: 0.22
        visit_done_rate:
          type: number
          format: float
          description: "推薦候補に対して visit_done が記録された比率。"
          example: 0.11
        reflection_saved_rate:
          type: number
          format: float
          description: "visit_done のうち reflection_saved が記録された比率。"
          example: 0.06

    ScoreV3Decision:
      type: object
      required:
        - active_candidate
        - rollback_required
        - reasons
      properties:
        active_candidate:
          type: boolean
          description: >
            以下をすべて満たす場合 true:
            top1_changed_rate_avg ≤ 0.10,
            activation_candidate_rate ≥ 0.80,
            max_abs_delta_max < 0.50,
            funnel 各指標がベースライン以上。
          example: true
        rollback_required:
          type: boolean
          description: >
            以下のいずれかを満たす場合 true:
            top1_changed_rate_avg > 0.20,
            max_abs_delta_max > 1.00,
            route_open_rate / visit_done_rate / reflection_saved_rate がベースラインより悪化,
            activation_candidate_rate < 0.50。
          example: false
        reasons:
          type: array
          items:
            type: string
          description: "active_candidate=false または rollback_required=true の原因を示す文字列リスト。条件を満たす場合は空配列。"
          example: []

    ScoreV3DashboardResponse:
      type: object
      required:
        - score_v3
        - funnel
        - decision
      properties:
        score_v3:
          $ref: "#/components/schemas/ScoreV3Metrics"
        funnel:
          $ref: "#/components/schemas/ScoreV3FunnelMetrics"
        decision:
          $ref: "#/components/schemas/ScoreV3Decision"

    ConciergePlanResponse:
      type: object
      required: [ok, query, stops, data]
      additionalProperties: true
      properties:
        ok:
          type: boolean
        query:
          type: string
        transportation:
          type: string
          nullable: true
          enum: [walk, driving]
        main:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConciergePlanMain"
        route_hints:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConciergePlanRouteHints"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/ConciergePlanStop"
        data:
          $ref: "#/components/schemas/ConciergePlanData"

    DeepDiveAskRequest:
      type: object
      required: [shrine_id, question]
      properties:
        shrine_id:
          type: integer
          minimum: 1
          description: "対象神社のID"
        question:
          type: string
          maxLength: 2000
          description: >
            自由文の質問。空文字も許容する（分類できない入力として
            unanswered_aspects で正常に返る。エラーにはならない）。

    DeepDiveFactUsed:
      type: object
      required: [type, id, label]
      properties:
        type:
          type: string
          enum: [deity, history]
        id:
          type: integer
        label:
          type: string

    DeepDiveSourceUsed:
      type: object
      required: [id, title, publisher, source_type, url]
      properties:
        id:
          type: integer
        title:
          type: string
        publisher:
          type: string
        source_type:
          type: string
        url:
          type: string

    DeepDiveAskResponse:
      type: object
      required:
        [
          answer,
          readiness,
          question_type,
          facts_used,
          sources_used,
          limitations,
          unanswered_aspects,
        ]
      properties:
        answer:
          type: string
        readiness:
          type: string
          enum: [full, limited, not_ready]
        question_type:
          type: array
          items:
            type: string
        facts_used:
          type: array
          items:
            $ref: "#/components/schemas/DeepDiveFactUsed"
        sources_used:
          type: array
          items:
            $ref: "#/components/schemas/DeepDiveSourceUsed"
        limitations:
          type: string
          nullable: true
        unanswered_aspects:
          type: array
          items:
            type: string
