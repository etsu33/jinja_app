name: backend-integration

permissions:
  contents: read
on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-integration.yml'
  workflow_dispatch:
    inputs:
      concierge_throttle:
        description: "DRF throttle for concierge"
        type: string
        default: 100/min
      pytest_target:
        description: "Optional pytest file/path for targeted integration validation"
        type: string
        default: ""

concurrency:
  group: backend-integration-${{ github.ref }}
  cancel-in-progress: true



jobs:
  call:
    uses: ./.github/workflows/backend-tests.yml
    with:
      mode: integration
      concierge_throttle: ${{ inputs.concierge_throttle || '100/min' }}
      pytest_target: ${{ inputs.pytest_target || '' }}
    secrets:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
