name: sph21-postgresql17-snapshot

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/sph21-postgresql17-snapshot.yml'
      - 'docs/audit/sql/sph21_permission_snapshot.sql'
      - 'backend/tests/test_sph21_permission_snapshot_sql.py'
      - 'backend/tests/test_sph21_permission_snapshot_sql_db.py'

permissions:
  contents: read

jobs:
  snapshot-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jinja_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: local-only-pg17-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U admin -d jinja_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: 'true'
      DJANGO_SETTINGS_MODULE: shrine_project.settings
      PYTHONPATH: ${{ github.workspace }}/backend
      IS_PYTEST: '1'
      DISABLE_GIS_FOR_TESTS: '1'
      USE_SQLITE: '0'
      USE_GIS: '0'
      DATABASE_URL: postgres://admin:local-only-pg17-test@127.0.0.1:5432/jinja_db
      DJANGO_SECRET_KEY: ci-only-test-secret-not-production
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend test requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Assert disposable PostgreSQL major version 17
        run: |
          python -c "import psycopg; c=psycopg.connect('postgres://admin:local-only-pg17-test@127.0.0.1:5432/jinja_db'); v=c.info.server_version; print('PostgreSQL major version:', v//10000); assert v//10000 == 17; c.close()"
      - name: Run S0-S9 static and disposable DB tests
        run: python -m pytest -q tests/test_sph21_permission_snapshot_sql.py tests/test_sph21_permission_snapshot_sql_db.py
